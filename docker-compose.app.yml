version: "3.8"
services:
  llm-medication-spellcheck:
    build:
      context: .
      args:
        PORT: ${PORT}
    restart: unless-stopped
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      PORT: ${PORT}
    ports:
      - ${PORT}:${PORT}
    volumes:
      - .:/app
      - /dev/null:/app/.env
